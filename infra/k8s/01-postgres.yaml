---
# ConfigMap for Postgres init
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-env
  namespace: chatops
data:
  POSTGRES_USER: chatops
  POSTGRES_DB: chatops

---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: chatops
type: Opaque
stringData:
  POSTGRES_PASSWORD: change_me   # override with a real secret in production

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: chatops
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-env
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "chatops"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "chatops"]
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          emptyDir: {}   # ephemeral; use PVC for persistence in production

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: chatops
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
