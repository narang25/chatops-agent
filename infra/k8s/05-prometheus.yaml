---
# Prometheus ConfigMap with scrape config
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: chatops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: "payment-service"
        static_configs:
          - targets: ["payment-service:8001"]
        metrics_path: /metrics

      - job_name: "order-service"
        static_configs:
          - targets: ["order-service:8002"]
        metrics_path: /metrics

      - job_name: "inventory-service"
        static_configs:
          - targets: ["inventory-service:8003"]
        metrics_path: /metrics

      # cAdvisor (if running as a DaemonSet or sidecar)
      - job_name: "cadvisor"
        static_configs:
          - targets: ["cadvisor:8080"]

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: chatops
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.51.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/etc/prometheus/console_libraries"
            - "--web.console.templates=/etc/prometheus/consoles"
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: chatops
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
