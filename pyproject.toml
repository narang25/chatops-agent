[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatops-agent"
version = "0.1.0"
description = "ChatOps SRE Agent — runbook RAG + LangGraph brain + infra tools"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# auto-discover: agent/, rag/, mcp_servers/, interfaces/, infra/
where = ["."]

[tool.pytest.ini_options]
# Ensure repo root is always on sys.path when running pytest from any directory
pythonpath = ["."]
testpaths = ["mcp_servers", "infra/tests", "agent"]
